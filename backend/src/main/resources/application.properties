spring.application.name=marketplace

# Variables locales (correo, Stripe...) en backend/.env, que git ignora. Ver .env.example
# Se busca en la carpeta actual y en backend/, así funciona desde la terminal y desde el botón Run del IDE.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ─────────────────────────────────────────────────────────────
# Base de datos PostgreSQL (crear con docs/base_de_datos.sql)
# ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_db
spring.datasource.username=marketplace
spring.datasource.password=MarketplaceLR2026
spring.datasource.driver-class-name=org.postgresql.Driver
# Si la base no responde en 5 s la solicitud falla rápido y /salud lo reporta (HU-49)
spring.datasource.hikari.connection-timeout=5000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Restricciones que JPA no crea (FK, CHECK, trigger de auditoría)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema-extra.sql
spring.sql.init.separator=@@

# ─────────────────────────────────────────────────────────────
# Servidor
# ─────────────────────────────────────────────────────────────
server.port=8080
app.frontend.url=http://localhost:5173

# ─────────────────────────────────────────────────────────────
# JWT (ADR-05): 60 minutos, bloqueo de 15 min tras 5 intentos
# Secreto solo para desarrollo local. En despliegue usar la variable JWT_SECRET.
# ─────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:Kd9jmuDVoCZIFFaVwKNpP5gEGgwhsF4cJ25q7lXZS+vxoE7sw3dYxkAwaE1a4XuU}
jwt.expiration=3600000
jwt.recuperacion.expiration=1800000
seguridad.intentos.maximos=5
seguridad.bloqueo.minutos=15

# ─────────────────────────────────────────────────────────────
# Pagos (ADR-03 y ADR-04)
# pagos.modo=simulado  → no necesita claves, aprueba o rechaza según el método de pago
# pagos.modo=stripe    → usa Stripe en modo pruebas (exportar STRIPE_SECRET_KEY=sk_test_...)
# ─────────────────────────────────────────────────────────────
pagos.modo=${PAGOS_MODO:simulado}
stripe.secret.key=${STRIPE_SECRET_KEY:}
pagos.timeout.segundos=10
pagos.cortacircuitos.fallos=5
pagos.cortacircuitos.espera.segundos=30
idempotencia.horas=24

# ─────────────────────────────────────────────────────────────
# Outbox de notificaciones (ADR-07)
# ─────────────────────────────────────────────────────────────
outbox.intentos.maximos=3
outbox.intervalo.ms=10000

# ─────────────────────────────────────────────────────────────
# Correo (recuperación de clave y notificaciones)
# correo.modo=simulado → no envía nada, solo deja el aviso en el log (por defecto, pruebas y CI)
# correo.modo=smtp     → envía correos reales. Con Gmail: activar verificación en 2 pasos,
#                        crear una "contraseña de aplicación" y exportar:
#                        CORREO_MODO=smtp  CORREO_USUARIO=tucorreo@gmail.com  CORREO_CLAVE=xxxx xxxx xxxx xxxx
# ─────────────────────────────────────────────────────────────
correo.modo=${CORREO_MODO:simulado}
correo.remitente=${CORREO_USUARIO:no-reply@marketplace.com}
spring.mail.host=${CORREO_HOST:smtp.gmail.com}
spring.mail.port=${CORREO_PUERTO:587}
spring.mail.username=${CORREO_USUARIO:}
spring.mail.password=${CORREO_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─────────────────────────────────────────────────────────────
# Imágenes de los alojamientos (HU-07): adaptador de almacenamiento local
# ─────────────────────────────────────────────────────────────
almacenamiento.ruta=${ALMACENAMIENTO_RUTA:uploads/imagenes}
almacenamiento.url.base=${ALMACENAMIENTO_URL:http://localhost:8080/imagenes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ─────────────────────────────────────────────────────────────
# Logs estructurados (HU-49)
# Consola legible para desarrollar; el archivo logs/marketplace.log va en JSON (nivel, fecha,
# correlacionId, usuarioId, operacion). En despliegue también se puede poner la consola en JSON con
# la variable LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
# ─────────────────────────────────────────────────────────────
logging.file.name=logs/marketplace.log
logging.structured.format.file=logstash
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlacionId:-}] [usuario=%X{usuarioId:-anonimo}] %logger{20} - %msg%n

# ─────────────────────────────────────────────────────────────
# Swagger UI (MKT-102): http://localhost:8080/swagger-ui.html
# ─────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ─────────────────────────────────────────────────────────────
# Paginación (ADR-08)
# ─────────────────────────────────────────────────────────────
paginacion.tamano.defecto=20
paginacion.tamano.maximo=100

# ─────────────────────────────────────────────────────────────
# Usuario administrador inicial
# ─────────────────────────────────────────────────────────────
admin.correo=admin@marketplace.com
admin.clave=Admin2026*
